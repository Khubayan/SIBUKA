; SIBUKA Queue Worker — salin ke /etc/supervisor/conf.d/sibuka-worker.conf
; Sesuaikan path /var/www/sibuka dengan lokasi instalasi di server.

[program:sibuka-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/sibuka/artisan queue:work database --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/sibuka/storage/logs/worker.log
stopwaitsecs=3600
